<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#040906">
<title>Avengers: Doomsday — Manila Countdown</title>
<meta name="description" content="A fan countdown to December 16, 2026 at midnight Philippine time.">
<link rel="stylesheet" href="styles.css"></head>
<body><main class="screen"><div class="atmosphere" aria-hidden="true"><span class="light-ray light-ray--left"></span><span class="light-ray light-ray--center"></span><span class="light-ray light-ray--right"></span><canvas class="dust-canvas" id="dust" aria-hidden="true"></canvas></div><section class="clock" aria-labelledby="title"><h1 id="title">DOOMSDAY IS COMING</h1><div class="units" role="timer" aria-label="Countdown to December 16, 2026, midnight Philippine time">
<div class="unit"><span class="number" id="months">00</span><span class="label">MONTHS</span></div><span class="colon" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="days">00</span><span class="label">DAYS</span></div><span class="colon" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="hours">00</span><span class="label">HOURS</span></div><span class="colon" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="minutes">00</span><span class="label">MINUTES</span></div><span class="colon" aria-hidden="true">:</span>
<div class="unit"><span class="number" id="seconds">00</span><span class="label">SECONDS</span></div></div>
<p class="end">DOOMSDAY HAS ARRIVED</p></section><button id="sound-toggle" type="button" aria-label="Sound" aria-pressed="false" title="Sound off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><g class="sound-on"><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></g><g class="sound-off"><path d="m16 9 5 6"/><path d="m21 9-5 6"/></g></svg></button></main>
<script src="countdown.js"></script>
<script src="dust.js"></script></body></html>
